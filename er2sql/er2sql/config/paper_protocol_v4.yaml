protocol_version: 4
amendment_date: '2026-10-07'
status: locked_reference_policy_amendment_before_final_model_outputs
supersedes_for_future_runs: config/paper_protocol_v3.yaml
repair: false
arms:
  structured: image_to_json_to_sql
  direct: image_to_sql
primary:
  endpoint: planned_constraint_pass_rate
  reference: original_scraped_source_ddl_final_resolved_state
  authoritative_schema_rule: Apply every source ALTER operation in source order; the final relational state of the original scraped DDL is ground truth. Diagrams and model output are not ground truth.
  paired_reference_rule: The planned test suite is generated deterministically from the same resolved source schema for both arms and all models on each schema-tier cell.
  paired_comparison_guard: compare_gold_sql_sha256_and_planned_test_counts_per_schema_tier_cell
  definition: passed tests from the shared resolved-source gold behavioral constraint suite divided by all planned tests in that suite; generation, parsing, and DDL failures contribute zero successes
  macro_companion: macro_cer_all
  comparison: structured_minus_direct_within_model_on_same_schema_tier_cells
secondary:
  - execution_conditional_constraint_enforcement_rate
  - planned_test_pass_rate
  - execution_conditional_test_pass_rate
  - compile_rate
  - final_sql_structural_precision_recall_f1
  - latency_tokens_cost_and_failure_breakdowns
  - tier_dropoff
selection:
  development_registry: config/development_schemas.json
  exclusions: exclude_and_document_before_scoring_only_under_locked_categories
  truncation_policy: exclude_paired_schema_tier_cell_from_both_arms
  truncation_reason: confirmed_unusable_output_after_provider_output_limit
  truncation_confirmation: A provider length/max_tokens finish reason is necessary but not sufficient; require an unusable output at that stage. A valid parsed/validated output remains scored; omission counts as a model error.
  unaffected_tiers_for_same_schema_remain_included: true
  chunking_or_regeneration: false
  exclusion_categories:
    - source_foreign_key_targets_non_unique_column
    - source_contains_conflicting_duplicate_table_definitions
    - source_SET_domain_not_mechanically_representable
    - source_remains_unparseable_after_comment_stripping_and_supported_ALTER_resolution
    - unresolved_ALTER_operation_after_converter_fix
    - schema_0924_372982_is_sqlite_internal_sqlite_stat1_metadata
    - unsupported_reference_fails_postgresql_execution_or_generated_reference_checks
  no_quality_based_exclusions: true
reference_conversion:
  source_immutable: true
  policy_approved_change_categories:
    - integer_display_width_removal
    - identity_by_default
    - approved_mysql_oracle_type_mappings
    - comments_to_comment_on
    - ordinary_and_unique_index_translation
    - physical_engine_charset_encoding_removal
    - foreign_key_relocation_without_constraint_change
    - trailing_comma_removal
    - required_reserved_identifier_quoting
    - quoted_identifier_lowercase_folding_unless_collision
    - unsigned_integer_widening_without_synthetic_check
    - enum_to_text_or_varchar_with_exact_membership_check
    - binary_or_varbinary_to_bytea_without_length_semantics
    - collation_removal
    - on_update_current_timestamp_removal
    - double_precision_mapping
    - number_wildcard_to_unconstrained_numeric
  policy_approval: changed_candidate_with_only_approved_changes_no_blockers_and_all_postgresql_reference_checks_passing
  one_off_review: named_reviewer_source_hash_candidate_hash_and_semantic_note
  forbidden: invent_types_keys_or_constraints_to_force_compilation
  residual_unresolved_cases: exclude_and_document_individually
module3:
  shared_prompt: src/er2sql/module3_generation/prompts.py
  postgres_only: true
  requirements:
    - explicit_mysql_to_postgresql_type_mapping
    - quote_reserved_identifiers
    - create_tables_before_deferred_foreign_keys
    - foreign_keys_must_target_primary_or_unique_key
models:
  arms: [structured, direct]
  common_output_token_cap: 16384
  provider_cannot_support_cap: report_as_provider_or_model_tier_limitation
  per_model_cap_reduction: prohibited
statistics:
  inference_mode: descriptive_effect_sizes_and_pointwise_intervals
  resampling_unit: schema_id_with_all_paired_tiers
  bootstrap_replicates: 5000
  bootstrap_seed: 20260930
  confidence_level: 0.95
reporting:
  report_surviving_reference_count_and_exclusion_categories: true
  report_policy_approvals_with_matching_hashes: true
  report_named_one_off_reviews: true
  two_arms_only: true
  truncation_exclusions_are_logged: true
  distinguish_provider_output_limit_finish_from_confirmed_unusable_truncation: true
  report_planned_denominator_primary_and_execution_conditional_secondary: true
  historic_v1_v2_v3_pilot_reports_are_preserved: true
