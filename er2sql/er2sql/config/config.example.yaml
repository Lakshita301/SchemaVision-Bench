# module3_generation:
#   model: qwen/qwen-2.5-72b-instruct
#   api_base: https://openrouter.ai/api/v1
#   api_key_env: OPENROUTER_API_KEY
#   temperature: 0.2
#   max_retries: 3

sql_dialect: postgres   # only affects prompt wording for Module 3 right now

# Optional. If this whole 'database' section is omitted, Modules 4/5
# (Constraint Test Generator + SQL Verification) are skipped entirely
# and the pipeline behaves exactly like Module 2 + Module 3 only.
# Requires a real, reachable Postgres server -- see README.md section
# "Setting up Postgres for Module 4/5 verification" for setup options
# (local install or Docker) and exactly what to put here.
database:
  host: localhost
  port: 5432
  dbname: er2sql_paper_verify
  user: er2sql_runner
  password_env: ER2SQL_VERIFY_DB_PASSWORD
  schema_prefix: er2sql_verify   # namespace prefix Module 5 creates per schema, always rolled back
  statement_timeout_ms: 5000     # safety cap per SQL statement during verification

dataset:
  tiers:
    tier1:
      diagrams_dir: data/tier1/diagrams
      sql_dir: data/tier1/ground_truth_sql
    tier2:
      diagrams_dir: data/tier2/diagrams
      sql_dir: data/tier2/ground_truth_sql
    tier3:
      diagrams_dir: data/tier3/diagrams
      sql_dir: data/tier3/ground_truth_sql

output:
  base_dir: outputs
